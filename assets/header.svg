<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#120c24" />
    </linearGradient>

    <!-- Accent Gradient Cyan-Purple -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00bbf9" />
      <stop offset="100%" stop-color="#9b5de5" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.8" opacity="0.45" />
      <circle cx="30" cy="0" r="1" fill="#00bbf9" opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.4; }
    }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .pulsing { animation: pulseGlow 4s ease-in-out infinite; }
    .floating { animation: floatOrb 5s ease-in-out infinite; }
    .name-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.5px; }
    .sub-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.5px; }
    .badge-text { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; }
  </style>

  <!-- Background Card -->
  <rect width="900" height="220" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="220" rx="16" fill="url(#grid)" />

  <!-- Outer Neon Border -->
  <rect x="1.5" y="1.5" width="897" height="217" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.8" opacity="0.75" />

  <!-- Ambient Light Orbs -->
  <circle cx="780" cy="60" r="90" fill="#9b5de5" opacity="0.18" filter="url(#neonGlow)" class="pulsing" />
  <circle cx="120" cy="170" r="80" fill="#00f5d4" opacity="0.15" filter="url(#neonGlow)" class="pulsing" />

  <!-- Neural Network Web Deco (Right Side) -->
  <g opacity="0.65" class="floating">
    <!-- Links -->
    <line x1="720" y1="45" x2="790" y2="70" stroke="#00bbf9" stroke-width="1.2" opacity="0.5" />
    <line x1="790" y1="70" x2="840" y2="40" stroke="#9b5de5" stroke-width="1.2" opacity="0.5" />
    <line x1="790" y1="70" x2="810" y2="135" stroke="#00f5d4" stroke-width="1.2" opacity="0.5" />
    <line x1="840" y1="40" x2="870" y2="100" stroke="#00bbf9" stroke-width="1.2" opacity="0.5" />
    <line x1="810" y1="135" x2="870" y2="100" stroke="#9b5de5" stroke-width="1.2" opacity="0.5" />
    <line x1="720" y1="120" x2="810" y2="135" stroke="#00bbf9" stroke-width="1.2" opacity="0.5" />
    <line x1="720" y1="45" x2="720" y2="120" stroke="#00f5d4" stroke-width="1.2" opacity="0.5" />
    <line x1="810" y1="135" x2="835" y2="185" stroke="#00f5d4" stroke-width="1.2" opacity="0.5" />

    <!-- Nodes -->
    <circle cx="720" cy="45" r="4.5" fill="#00f5d4" filter="url(#softGlow)" />
    <circle cx="790" cy="70" r="6" fill="#00bbf9" filter="url(#softGlow)" />
    <circle cx="840" cy="40" r="4" fill="#9b5de5" filter="url(#softGlow)" />
    <circle cx="870" cy="100" r="5" fill="#f15bb5" filter="url(#softGlow)" />
    <circle cx="810" cy="135" r="5.5" fill="#00f5d4" filter="url(#softGlow)" />
    <circle cx="720" cy="120" r="4" fill="#00bbf9" filter="url(#softGlow)" />
    <circle cx="835" cy="185" r="4" fill="#9b5de5" filter="url(#softGlow)" />
  </g>

  <!-- Left Icon Emblem: AI Hexagon -->
  <g transform="translate(48, 52)">
    <polygon points="34,4 64,21 64,55 34,72 4,55 4,21" fill="#131c31" stroke="url(#accentGrad)" stroke-width="2.5" filter="url(#softGlow)" />
    <!-- Brain / Synapse Glyphs -->
    <circle cx="34" cy="38" r="6" fill="#00f5d4" filter="url(#softGlow)" />
    <circle cx="20" cy="28" r="3.5" fill="#00bbf9" />
    <circle cx="48" cy="28" r="3.5" fill="#9b5de5" />
    <circle cx="22" cy="48" r="3" fill="#f15bb5" />
    <circle cx="46" cy="48" r="3" fill="#00f5d4" />
    <line x1="34" y1="38" x2="20" y2="28" stroke="#00bbf9" stroke-width="1.5" />
    <line x1="34" y1="38" x2="48" y2="28" stroke="#9b5de5" stroke-width="1.5" />
    <line x1="34" y1="38" x2="22" y2="48" stroke="#f15bb5" stroke-width="1.5" />
    <line x1="34" y1="38" x2="46" y2="48" stroke="#00f5d4" stroke-width="1.5" />
  </g>

  <!-- Typography Content -->
  <g transform="translate(142, 60)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="168" height="22" rx="11" fill="#15203b" stroke="#00f5d4" stroke-width="0.8" opacity="0.9" />
    <circle cx="10" cy="11" r="3.5" fill="#00f5d4" />
    <text x="20" y="15" fill="#00f5d4" class="badge-text">AI &amp; ML SPECIALIST</text>

    <!-- Main Name -->
    <text x="0" y="58" fill="#ffffff" class="name-title">
      Abhishek Maurya
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="86" fill="#94a3b8" class="sub-title">
      B.Tech CSE (AI &amp; ML) · Building Predictive, Vision-Guided &amp; Deep Learning Systems
    </text>

    <!-- Capability Tags -->
    <g transform="translate(0, 104)">
      <!-- Tag 1: Computer Vision -->
      <g>
        <rect x="0" y="0" width="128" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="10" y="16" fill="#38bdf8" class="badge-text">⚡ Computer Vision</text>
      </g>
      <!-- Tag 2: Deep Learning -->
      <g transform="translate(136, 0)">
        <rect x="0" y="0" width="118" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="10" y="16" fill="#c084fc" class="badge-text">🧠 Deep Learning</text>
      </g>
      <!-- Tag 3: NLP Pipelines -->
      <g transform="translate(262, 0)">
        <rect x="0" y="0" width="112" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="10" y="16" fill="#34d399" class="badge-text">🔍 NLP Pipelines</text>
      </g>
      <!-- Tag 4: Python & PyTorch -->
      <g transform="translate(382, 0)">
        <rect x="0" y="0" width="138" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="10" y="16" fill="#fbbf24" class="badge-text">🚀 Python &amp; Scikit</text>
      </g>
    </g>
  </g>
</svg>
