<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Professional Accent Line -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1f2937" stroke-width="0.75" opacity="0.35" />
      <circle cx="32" cy="0" r="0.8" fill="#38bdf8" opacity="0.3" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
    .title { font-weight: 800; font-size: 42px; letter-spacing: -1px; fill: #ffffff; }
    .tagline { font-weight: 500; font-size: 16px; letter-spacing: -0.2px; fill: #94a3b8; }
    .kicker { font-weight: 600; font-size: 12px; letter-spacing: 1.5px; fill: #38bdf8; text-transform: uppercase; }
    .pill-label { font-weight: 600; font-size: 11.5px; fill: #e2e8f0; letter-spacing: 0.3px; }
    .meta-item { font-size: 12px; fill: #64748b; font-weight: 500; }
  </style>

  <!-- Card Background -->
  <rect width="1000" height="280" rx="12" fill="url(#bg)" />
  <rect width="1000" height="280" rx="12" fill="url(#grid)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="998" height="278" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Accent Highlight Stripe -->
  <rect x="0" y="0" width="1000" height="3" fill="url(#accent)" rx="1.5" />

  <!-- Ambient Light Accents (Minimalist) -->
  <circle cx="880" cy="80" r="140" fill="#38bdf8" opacity="0.06" filter="url(#softGlow)" />
  <circle cx="100" cy="220" r="100" fill="#818cf8" opacity="0.05" filter="url(#softGlow)" />

  <!-- Subtle Neural Topology Graphic on Right -->
  <g opacity="0.35" transform="translate(680, 45)">
    <!-- Edges -->
    <line x1="40" y1="30" x2="120" y2="60" stroke="#38bdf8" stroke-width="1" />
    <line x1="120" y1="60" x2="190" y2="35" stroke="#818cf8" stroke-width="1" />
    <line x1="120" y1="60" x2="150" y2="130" stroke="#c084fc" stroke-width="1" />
    <line x1="40" y1="120" x2="120" y2="60" stroke="#38bdf8" stroke-width="1" />
    <line x1="40" y1="120" x2="150" y2="130" stroke="#818cf8" stroke-width="1" />
    <line x1="150" y1="130" x2="220" y2="110" stroke="#38bdf8" stroke-width="1" />
    <line x1="190" y1="35" x2="220" y2="110" stroke="#c084fc" stroke-width="1" />
    <line x1="150" y1="130" x2="180" y2="175" stroke="#38bdf8" stroke-width="1" />

    <!-- Nodes -->
    <circle cx="40" cy="30" r="3.5" fill="#38bdf8" />
    <circle cx="120" cy="60" r="5" fill="#818cf8" />
    <circle cx="190" cy="35" r="4" fill="#c084fc" />
    <circle cx="40" cy="120" r="3.5" fill="#38bdf8" />
    <circle cx="150" cy="130" r="4.5" fill="#38bdf8" />
    <circle cx="220" cy="110" r="4" fill="#818cf8" />
    <circle cx="180" cy="175" r="3" fill="#c084fc" />
  </g>

  <!-- Content Block -->
  <g transform="translate(64, 48)">

    <!-- Terminal-style Category Indicator -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="7" r="4" fill="#38bdf8" />
      <text x="18" y="11" class="font-mono kicker">AI &amp; MACHINE LEARNING ENGINEER</text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="60" class="font-sans title">
      Abhishek Maurya
    </text>

    <!-- Professional Tagline -->
    <text x="0" y="94" class="font-sans tagline">
      Specializing in Computer Vision, Deep Learning Kinematics &amp; Scalable ML Pipelines
    </text>

    <!-- Location & Credential Metadata -->
    <g transform="translate(0, 126)">
      <text x="0" y="0" class="font-mono meta-item">
        🎓 B.Tech in CSE (AI &amp; ML) · AKGEC (2023–2027)  |  📍 Ghaziabad, UP, India  |  ⚡ 200+ Algorithmic Problems
      </text>
    </g>

    <!-- Clean Executive Capability Badges -->
    <g transform="translate(0, 154)">
      <!-- Pill 1: Computer Vision -->
      <g>
        <rect x="0" y="0" width="168" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#38bdf8" />
        <text x="28" y="20" class="font-mono pill-label">Computer Vision</text>
      </g>
      <!-- Pill 2: Deep Learning -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="154" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#818cf8" />
        <text x="28" y="20" class="font-mono pill-label">Deep Learning</text>
      </g>
      <!-- Pill 3: NLP & Analytics -->
      <g transform="translate(346, 0)">
        <rect x="0" y="0" width="152" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#c084fc" />
        <text x="28" y="20" class="font-mono pill-label">NLP Pipelines</text>
      </g>
      <!-- Pill 4: End-to-End Systems -->
      <g transform="translate(510, 0)">
        <rect x="0" y="0" width="176" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#34d399" />
        <text x="28" y="20" class="font-mono pill-label">Full-Stack AI Apps</text>
      </g>
    </g>

  </g>
</svg>
